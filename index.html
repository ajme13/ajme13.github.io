<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="overscroll-behavior: none; overflow-x: hidden !important;" class="bg-light min-vh-100 d-flex flex-column justify-content-center py-4" >
    
    <header class="text-center mb-4">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div>
                <img class="img-fluid rounded-circle" style="max-width: 130px; height: auto;" src="https://i.pinimg.com/originals/65/ed/47/65ed47e698899c10bcd2ffb371e4b595.gif" alt="">
            </div>
        </div>
    </header>
    
    <main class=" px-3 container-fluid">
        <!-- Contenedor centrado y responsivo -->
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <section class="capsula card shadow-sm p-4 text-center">
                    <!-- Icono candado -->
                    <div class="bg-info bg-opacity-25 text-info mt-2 mx-auto d-flex justify-content-center align-items-center rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-lock fs-3"></i>
                    </div>

                    <!-- Título adaptable -->
                    <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                        <i class="bi bi-balloon-fill fs-3 text-danger"></i>
                        <h1 class="fs-4 fs-md-2 mb-0 fw-bold">Para alguien especial</h1>
                        <i class="bi bi-balloon-fill fs-3 text-danger"></i>
                    </div>

                    <p class="text-muted small mb-4">Ingresa la contraseña para continuar :00</p>

                    <form>
                        <fieldset class="border-0 p-0 m-0">
                            <legend class="fs-6 fw-bold text-start mb-2">Verificación:</legend>
                            <div class="text-start mb-3">
                                <label for="fechaN" class="form-label small text-muted">Quien es mi modelo a seguir? :0</label>
                                <input type="text" class="form-control form-control-lg" name="Nombre" id="nombre" placeholder="Xxxxx">
                            </div>
                        </fieldset>

                        <p id="texto_error" class="badge bg-danger w-100 text-wrap mt-2"></p>

                        <button type="button" class="btn btn-info text-white fw-bold w-100 py-2 mt-3 shadow-sm" id="boton">Ingresar</button>
                    </form>
                </section>

            </div>
        </div>
    </main>


    <script src="/js/script.js"></script>
    <script src="https://kit.fontawesome.com/ce8d39fc41.js" crossorigin="anonymous"></script>
</body>
</html>
