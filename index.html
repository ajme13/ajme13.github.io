<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="margin: 0;">
    
    <main style="min-height: 100vh; display: flex; justify-content: center; align-items: center;">

        <section class="capsula">
            <div style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <div>
                    <div class="bg-info mt-3 d-flex justify-content-center align-items-center rounded-circle" style="width: 60px; height: 60px; ">
                        <i class="fa-solid fa-lock fs-3"></i>
                    </div>
                </div>
                <div style="display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-balloon-fill fs-2"></i>
                    <h1 class="fs-2">Para alguien especial</h1>
                    <i class="bi bi-balloon-fill fs-2"></i>
                </div>
                <p>Ingresa tu fecha de nacimiento para continuar :00</p>

                <form action="">
                    <fieldset>
                        <legend class="fs-5 fw-bold">Verificacion:</legend>
                        <div>
                            <label for="fecha">Ingresa tu cumpleaños</label>
                            <input type="date" name="fechaN" id="fechaN" placeholder="dd/mm/aaaa">
                        </div>
                    </fieldset>
                    <button type="button" class="mt-3" id="boton">Ingresar</button>
                </form>
            </div>
        </section>

    </main>


    <script src="/js/script.js"></script>
    <script src="https://kit.fontawesome.com/ce8d39fc41.js" crossorigin="anonymous"></script>
</body>
</html>
